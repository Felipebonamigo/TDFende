name: Problema de playtest
description: Algo quebrado, estranho ou chato que apareceu jogando.
title: "[Playtest] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Uma Issue por problema. Pode escrever do jeito que vier; o Claude organiza, reproduz, corrige e fecha citando o commit.
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu
      description: O que você viu e o que esperava ver.
    validations:
      required: true
  - type: input
    id: onde
    attributes:
      label: Onde
      description: Modo (Tower Wars ou TD clássico), dificuldade, onda ou minuto, e a torre ou o bicho envolvido.
  - type: textarea
    id: como
    attributes:
      label: Como repetir
      description: Os passos, se souber. "Não sei repetir" também serve.
  - type: dropdown
    id: gravidade
    attributes:
      label: Gravidade
      options:
        - Trava ou fecha o jogo
        - Quebra a partida ou perde progresso
        - Atrapalha, mas dá para jogar
        - Incômodo ou visual
        - Sugestão
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão
      description: O selo "build <hash>" do executável, ou o commit.
  - type: dropdown
    id: plataforma
    attributes:
      label: Onde jogou
      options:
        - Executável Windows (Unity)
        - Unreal
        - Editor do Unity
        - Outro
  - type: textarea
    id: anexos
    attributes:
      label: Captura, vídeo ou arquivo
      description: Arraste o print ou o vídeo para cá. Se tiver o replay (F9) ou o Player.log, anexe também.
